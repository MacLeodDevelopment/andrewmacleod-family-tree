name: CI

# Runs on pull requests, and is called by deploy.yml before anything is deployed from main.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # Like NuGet's audit for the API: fail on known moderate-or-worse vulnerabilities.
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # On pull requests only: fail if the PR adds or upgrades a dependency (NuGet, npm or
  # GitHub Actions) that has a known moderate-or-worse vulnerability.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
