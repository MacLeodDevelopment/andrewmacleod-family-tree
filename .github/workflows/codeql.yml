name: CodeQL

# GitHub's code scanning: looks for security problems in the C#, TypeScript and
# workflow code (injection, unsafe data flows, risky workflow patterns and so on).
# Findings appear in the repository's Security tab and as annotations on pull requests.
# Runs on every PR, on every push to main, and weekly, because new checks are added
# over time and old code can turn out to be affected.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # "none": analyse the source directly, without building it.
        language: [csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
