name: Deploy

# Every push to main is tested, then deployed to production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  API_NAME: familytree-api
  API_ENVIRONMENT: familytree-env
  AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt

jobs:
  ci:
    name: Test
    uses: ./.github/workflows/ci.yml

  infra:
    name: Infrastructure
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      registryName: ${{ steps.deploy.outputs.registryName }}
      registryLoginServer: ${{ steps.deploy.outputs.registryLoginServer }}
      apiName: ${{ steps.deploy.outputs.apiName }}
      apiUrl: ${{ steps.deploy.outputs.apiUrl }}
      webName: ${{ steps.deploy.outputs.webName }}
      webUrl: ${{ steps.deploy.outputs.webUrl }}
      webCustomUrl: ${{ steps.deploy.outputs.webCustomUrl }}
      sqlServerName: ${{ steps.deploy.outputs.sqlServerName }}
      sqlServerHost: ${{ steps.deploy.outputs.sqlServerHost }}
      databaseName: ${{ steps.deploy.outputs.databaseName }}
      apiIdentityName: ${{ steps.deploy.outputs.apiIdentityName }}
      apiIdentityClientId: ${{ steps.deploy.outputs.apiIdentityClientId }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Redeploy with the image that is already running, so infrastructure changes
      # never roll the API back. On the first run there is no API yet.
      - name: Find the running API image
        id: current
        run: |
          image=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_NAME" \
            --query "properties.template.containers[0].image" --output tsv 2>/dev/null || true)
          echo "image=${image:-mcr.microsoft.com/dotnet/samples:aspnetapp}" >> "$GITHUB_OUTPUT"

      # ENTRA_CLIENT_ID comes from deploying infra/entra.bicep by hand (docs/setup-entra.md).
      # Without it the API refuses to start, so stop here with a clear message instead.
      - name: Check sign-in is configured
        run: |
          if [ -z "${{ vars.ENTRA_CLIENT_ID }}" ]; then
            echo "::error::The ENTRA_CLIENT_ID variable is not set on the production environment. See docs/setup-entra.md."
            exit 1
          fi

      # API_CUSTOM_DOMAIN is an optional environment variable (for example api.family.example.com).
      # Its managed certificate can only be issued once the hostname is on the app, so the first
      # deployment with a new domain needs a second pass to bind it. Look up whether it exists.
      - name: Check for the API custom domain's certificate
        id: certificate
        env:
          API_CUSTOM_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN }}
        run: |
          exists=false
          if [ -n "$API_CUSTOM_DOMAIN" ]; then
            count=$(az containerapp env certificate list --resource-group "$RESOURCE_GROUP" --name "$API_ENVIRONMENT" \
              --managed-certificates-only \
              --query "length([?properties.subjectName=='$API_CUSTOM_DOMAIN' && properties.provisioningState=='Succeeded'])" \
              --output tsv 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              exists=true
            fi
          fi
          echo "Certificate for '${API_CUSTOM_DOMAIN}' exists: $exists"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      # WEB_CUSTOM_DOMAIN is an optional environment variable (for example family.example.com).
      # Set it only once the domain's DNS CNAME points at the Static Web App.
      - name: Deploy Bicep
        id: deploy
        env:
          API_CUSTOM_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN }}
        run: |
          deploy() {
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$1" \
              --template-file infra/main.bicep \
              --parameters apiImage="${{ steps.current.outputs.image }}" webCustomDomain="${{ vars.WEB_CUSTOM_DOMAIN }}" \
                entraClientId="${{ vars.ENTRA_CLIENT_ID }}" \
                apiCustomDomain="$API_CUSTOM_DOMAIN" apiCustomDomainCertificateExists="$2" \
              --query properties.outputs --output json
          }

          outputs=$(deploy "familytree-${{ github.run_number }}" "${{ steps.certificate.outputs.exists }}")
          if [ -n "$API_CUSTOM_DOMAIN" ] && [ "${{ steps.certificate.outputs.exists }}" = "false" ]; then
            echo "The API custom domain's certificate has just been issued: deploying again to bind it."
            outputs=$(deploy "familytree-${{ github.run_number }}-bind" true)
          fi

          for key in registryName registryLoginServer apiName apiUrl webName webUrl webCustomUrl \
            sqlServerName sqlServerHost databaseName apiIdentityName apiIdentityClientId; do
            echo "$key=$(jq -r ".$key.value" <<< "$outputs")" >> "$GITHUB_OUTPUT"
          done
          {
            echo "### Deployed"
            echo "- Web app: $(jq -r '.webUrl.value' <<< "$outputs")"
            if [ -n "$(jq -r '.webCustomUrl.value' <<< "$outputs")" ]; then
              echo "- Web app (custom domain): $(jq -r '.webCustomUrl.value' <<< "$outputs")"
            fi
            echo "- API: $(jq -r '.apiUrl.value' <<< "$outputs")"
          } >> "$GITHUB_STEP_SUMMARY"

  # Brings the database schema up to date and lets the API's identity read and write
  # data, signed in as the SQL server's administrator (this deploy identity). Runs
  # before the new API starts, so the API never sees an out-of-date schema.
  database:
    name: Database
    needs: infra
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      SQL_SERVER_NAME: ${{ needs.infra.outputs.sqlServerName }}
      SQL_SERVER_HOST: ${{ needs.infra.outputs.sqlServerHost }}
      DATABASE_NAME: ${{ needs.infra.outputs.databaseName }}
      API_IDENTITY_NAME: ${{ needs.infra.outputs.apiIdentityName }}
      API_IDENTITY_CLIENT_ID: ${{ needs.infra.outputs.apiIdentityClientId }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The SQL firewall only admits Azure services; this runner isn't one. Open it to
      # this runner's address alone, for this job only.
      - name: Open the SQL firewall to this runner
        id: firewall
        run: |
          address=$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)
          rule="github-runner-${{ github.run_id }}-${{ github.run_attempt }}"
          az sql server firewall-rule create --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" \
            --name "$rule" --start-ip-address "$address" --end-ip-address "$address" --output none
          echo "rule=$rule" >> "$GITHUB_OUTPUT"

      # "Active Directory Default" signs in to SQL with the Azure CLI's login from
      # azure/login above, as the deploy identity. Retried, because a new firewall rule
      # can take a minute to apply and a paused database takes a minute to resume.
      - name: Apply migrations and grant the API access
        run: |
          connection="Server=tcp:$SQL_SERVER_HOST,1433;Database=$DATABASE_NAME;Authentication=Active Directory Default;Encrypt=True;Connect Timeout=60"
          dotnet build src/FamilyTree.DbMigrator --configuration Release
          for attempt in 1 2 3 4 5; do
            if dotnet run --project src/FamilyTree.DbMigrator --configuration Release --no-build -- \
                --connection "$connection" --grant-read-write "$API_IDENTITY_NAME" "$API_IDENTITY_CLIENT_ID"; then
              exit 0
            fi
            echo "Attempt $attempt failed; waiting before trying again."
            sleep 30
          done
          echo "::error::Couldn't migrate the database after 5 attempts."
          exit 1

      - name: Close the SQL firewall
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az sql server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER_NAME" \
            --name "${{ steps.firewall.outputs.rule }}"

  api:
    name: API
    needs: [infra, database]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the container image
        run: |
          az acr login --name "${{ needs.infra.outputs.registryName }}"
          dotnet publish src/FamilyTree.Api --configuration Release -t:PublishContainer \
            -p:ContainerRegistry="${{ needs.infra.outputs.registryLoginServer }}" \
            -p:ContainerImageTag="${{ github.sha }}"

      - name: Deploy the new image
        id: update
        run: |
          revision=$(az containerapp update --resource-group "$RESOURCE_GROUP" --name "${{ needs.infra.outputs.apiName }}" \
            --image "${{ needs.infra.outputs.registryLoginServer }}/familytree-api:${{ github.sha }}" \
            --query properties.latestRevisionName --output tsv)
          echo "Created revision $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # `az containerapp update` returns once the new revision exists, but traffic only moves
      # to it once it has started. Until then the old revision keeps answering, and if the new
      # one never starts, the old one would quietly keep serving. So wait for the new revision
      # to be healthy and taking all the traffic, and fail if it doesn't get there.
      - name: Wait for the new revision to take over
        run: |
          revision="${{ steps.update.outputs.revision }}"
          for attempt in $(seq 1 30); do
            # Steps run under `bash -e`. Use a here-string for `read`: fed input without a
            # trailing newline, `read` returns 1 and silently ends the step.
            status=$(az containerapp revision show \
              --resource-group "$RESOURCE_GROUP" --name "${{ needs.infra.outputs.apiName }}" --revision "$revision" \
              --query "[properties.healthState, properties.runningState, properties.trafficWeight]" --output tsv | tr '\r\n' '  ')
            read -r health running traffic <<< "$status"
            echo "Attempt $attempt: health=$health running=$running traffic=$traffic"
            if [ "$health" = "Healthy" ] && [ "$traffic" = "100" ]; then
              exit 0
            fi
            if [ "$running" = "Failed" ] || [ "$running" = "Degraded" ]; then
              echo "::error::Revision $revision failed to start. Check its logs: az containerapp logs show -g $RESOURCE_GROUP -n ${{ needs.infra.outputs.apiName }} --revision $revision --type console"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Revision $revision was not healthy and serving all traffic after 5 minutes."
          exit 1

      # The API scales to zero, so allow time for a cold start.
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "${{ needs.infra.outputs.apiUrl }}/health"

      # Everything except the health checks requires sign-in, so an anonymous request must be refused.
      # /health/ready also checks the API can reach the database, as its own managed
      # identity, which proves the connection string and the database user both work.
      # Retried for up to a few minutes: the serverless database may be resuming.
      - name: Smoke test that the API can reach its database
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 15 --retry-all-errors --max-time 90 \
            "${{ needs.infra.outputs.apiUrl }}/health/ready"

      - name: Smoke test that the API requires sign-in
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" "${{ needs.infra.outputs.apiUrl }}/api/v1/me")
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 from /api/v1/me without a token, got $status"
            exit 1
          fi

      # The web app on its custom domain must be allowed to call the API (CORS).
      - name: Smoke test the custom domain's API access
        if: needs.infra.outputs.webCustomUrl != ''
        run: |
          allowed=$(curl --fail --silent --show-error --dump-header - --output /dev/null \
            --header "Origin: ${{ needs.infra.outputs.webCustomUrl }}" "${{ needs.infra.outputs.apiUrl }}/health" \
            | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2)
          if [ "$allowed" != "${{ needs.infra.outputs.webCustomUrl }}" ]; then
            echo "::error::The API does not allow ${{ needs.infra.outputs.webCustomUrl }} (got '${allowed}')"
            exit 1
          fi

  web:
    name: Web app
    needs: [infra, api]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        # Baked into the JavaScript at build time. None of these are secrets.
        env:
          VITE_API_BASE_URL: ${{ needs.infra.outputs.apiUrl }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          npm ci
          npm run build

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Fetch the Static Web Apps deployment token at run time instead of storing it as a secret.
      - name: Get the deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list --resource-group "$RESOURCE_GROUP" \
            --name "${{ needs.infra.outputs.webName }}" --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ needs.infra.outputs.webUrl }}" \
            | grep --quiet "<title>Family Tree - Andrew MacLeod</title>"

      # The security headers come from staticwebapp.config.json, generated by the web build
      # (web/build/staticWebApp.ts). Check Azure is really serving them, and that paths the
      # app handles itself (deep links) serve the app.
      - name: Smoke test the security headers and deep links
        env:
          WEB_URL: ${{ needs.infra.outputs.webUrl }}
          API_URL: ${{ needs.infra.outputs.apiUrl }}
        run: |
          headers=$(curl --fail --silent --show-error --head "$WEB_URL" | tr -d '\r')
          csp=$(grep -i '^content-security-policy:' <<< "$headers" || true)
          api_origin=$(sed -E 's#^(https?://[^/]+).*#\1#' <<< "$API_URL")
          deep_link=$(curl --silent --show-error "$WEB_URL/people/123" || true)

          failed=0
          shopt -s nocasematch
          check() {
            if [[ "$1" == *"$2"* ]]; then
              echo "OK: $3"
            else
              echo "::error::$3"
              failed=1
            fi
          }
          check "$csp" "frame-ancestors 'none'" "The Content Security Policy forbids framing"
          check "$csp" "connect-src 'self' $api_origin " "The Content Security Policy allows the API ($api_origin)"
          check "$headers" "x-content-type-options: nosniff" "X-Content-Type-Options is nosniff"
          check "$headers" "x-robots-tag: noindex" "Search engines are asked not to index"
          check "$deep_link" "<title>Family Tree - Andrew MacLeod</title>" "Deep links (/people/123) serve the app"
          exit "$failed"
