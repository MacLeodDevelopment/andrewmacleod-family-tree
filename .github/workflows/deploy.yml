name: Deploy

# Every push to main is tested, then deployed to production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  API_NAME: familytree-api
  AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt

jobs:
  ci:
    name: Test
    uses: ./.github/workflows/ci.yml

  infra:
    name: Infrastructure
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      registryName: ${{ steps.deploy.outputs.registryName }}
      registryLoginServer: ${{ steps.deploy.outputs.registryLoginServer }}
      apiName: ${{ steps.deploy.outputs.apiName }}
      apiUrl: ${{ steps.deploy.outputs.apiUrl }}
      webName: ${{ steps.deploy.outputs.webName }}
      webUrl: ${{ steps.deploy.outputs.webUrl }}
      webCustomUrl: ${{ steps.deploy.outputs.webCustomUrl }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Redeploy with the image that is already running, so infrastructure changes
      # never roll the API back. On the first run there is no API yet.
      - name: Find the running API image
        id: current
        run: |
          image=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$API_NAME" \
            --query "properties.template.containers[0].image" --output tsv 2>/dev/null || true)
          echo "image=${image:-mcr.microsoft.com/dotnet/samples:aspnetapp}" >> "$GITHUB_OUTPUT"

      # ENTRA_CLIENT_ID comes from deploying infra/entra.bicep by hand (docs/setup-entra.md).
      # Without it the API refuses to start, so stop here with a clear message instead.
      - name: Check sign-in is configured
        run: |
          if [ -z "${{ vars.ENTRA_CLIENT_ID }}" ]; then
            echo "::error::The ENTRA_CLIENT_ID variable is not set on the production environment. See docs/setup-entra.md."
            exit 1
          fi

      # WEB_CUSTOM_DOMAIN is an optional environment variable (for example family.example.com).
      # Set it only once the domain's DNS CNAME points at the Static Web App.
      - name: Deploy Bicep
        id: deploy
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "familytree-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters apiImage="${{ steps.current.outputs.image }}" webCustomDomain="${{ vars.WEB_CUSTOM_DOMAIN }}" \
              entraClientId="${{ vars.ENTRA_CLIENT_ID }}" \
            --query properties.outputs --output json)
          for key in registryName registryLoginServer apiName apiUrl webName webUrl webCustomUrl; do
            echo "$key=$(jq -r ".$key.value" <<< "$outputs")" >> "$GITHUB_OUTPUT"
          done
          {
            echo "### Deployed"
            echo "- Web app: $(jq -r '.webUrl.value' <<< "$outputs")"
            if [ -n "$(jq -r '.webCustomUrl.value' <<< "$outputs")" ]; then
              echo "- Web app (custom domain): $(jq -r '.webCustomUrl.value' <<< "$outputs")"
            fi
            echo "- API: $(jq -r '.apiUrl.value' <<< "$outputs")"
          } >> "$GITHUB_STEP_SUMMARY"

  api:
    name: API
    needs: infra
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the container image
        run: |
          az acr login --name "${{ needs.infra.outputs.registryName }}"
          dotnet publish src/FamilyTree.Api --configuration Release -t:PublishContainer \
            -p:ContainerRegistry="${{ needs.infra.outputs.registryLoginServer }}" \
            -p:ContainerImageTag="${{ github.sha }}"

      - name: Deploy the new image
        id: update
        run: |
          revision=$(az containerapp update --resource-group "$RESOURCE_GROUP" --name "${{ needs.infra.outputs.apiName }}" \
            --image "${{ needs.infra.outputs.registryLoginServer }}/familytree-api:${{ github.sha }}" \
            --query properties.latestRevisionName --output tsv)
          echo "Created revision $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # `az containerapp update` returns once the new revision exists, but traffic only moves
      # to it once it has started. Until then the old revision keeps answering, and if the new
      # one never starts, the old one would quietly keep serving. So wait for the new revision
      # to be healthy and taking all the traffic, and fail if it doesn't get there.
      - name: Wait for the new revision to take over
        run: |
          revision="${{ steps.update.outputs.revision }}"
          for attempt in $(seq 1 30); do
            read -r health running traffic < <(az containerapp revision show \
              --resource-group "$RESOURCE_GROUP" --name "${{ needs.infra.outputs.apiName }}" --revision "$revision" \
              --query "[properties.healthState, properties.runningState, properties.trafficWeight]" --output tsv | tr '\n' ' ')
            echo "Attempt $attempt: health=$health running=$running traffic=$traffic"
            if [ "$health" = "Healthy" ] && [ "$traffic" = "100" ]; then
              exit 0
            fi
            if [ "$running" = "Failed" ] || [ "$running" = "Degraded" ]; then
              echo "::error::Revision $revision failed to start. Check its logs: az containerapp logs show -g $RESOURCE_GROUP -n ${{ needs.infra.outputs.apiName }} --revision $revision --type console"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Revision $revision was not healthy and serving all traffic after 5 minutes."
          exit 1

      # The API scales to zero, so allow time for a cold start.
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "${{ needs.infra.outputs.apiUrl }}/health"

      # Everything except /health requires sign-in, so an anonymous request must be refused.
      - name: Smoke test that the API requires sign-in
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" "${{ needs.infra.outputs.apiUrl }}/api/v1/me")
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 from /api/v1/me without a token, got $status"
            exit 1
          fi

      # The web app on its custom domain must be allowed to call the API (CORS).
      - name: Smoke test the custom domain's API access
        if: needs.infra.outputs.webCustomUrl != ''
        run: |
          allowed=$(curl --fail --silent --show-error --dump-header - --output /dev/null \
            --header "Origin: ${{ needs.infra.outputs.webCustomUrl }}" "${{ needs.infra.outputs.apiUrl }}/health" \
            | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2)
          if [ "$allowed" != "${{ needs.infra.outputs.webCustomUrl }}" ]; then
            echo "::error::The API does not allow ${{ needs.infra.outputs.webCustomUrl }} (got '${allowed}')"
            exit 1
          fi

  web:
    name: Web app
    needs: [infra, api]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ needs.infra.outputs.apiUrl }}
        run: |
          npm ci
          npm run build

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Fetch the Static Web Apps deployment token at run time instead of storing it as a secret.
      - name: Get the deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list --resource-group "$RESOURCE_GROUP" \
            --name "${{ needs.infra.outputs.webName }}" --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ needs.infra.outputs.webUrl }}" \
            | grep --quiet "<title>Family Tree - Andrew MacLeod</title>"
